<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terrain Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen field instrument — portrait viewfinder, control strip below. Single dark HUD look by choice. */
:root{
  --ground:#0c1114; --panel:#141c21; --line:#26343c; --ink:#dfe8ec; --muted:#8299a3;
  --scan:#4fc3f7; --safe:#4be38a; --risk:#ff4d5e;
  --hud:"Chakra Petch", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{margin:0;font-size:14px;background:var(--ground);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px}
.view{position:relative;aspect-ratio:9/16;width:min(100%,calc((100dvh - 250px) * 9 / 16));min-width:220px;max-width:100%;
  border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;left:12px;right:12px;bottom:44px;padding:10px 12px;border-radius:8px;background:rgba(12,17,20,.9);
  border:1px solid var(--risk);font-size:13px;line-height:1.5}
.msg.info{border-color:var(--scan)}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:560px}
button,label.btn{font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;min-height:40px}
.zh{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500}
button[aria-pressed="true"]{border-color:var(--scan);color:var(--scan)}
button.primary{border-color:var(--safe);color:var(--safe)}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--scan);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.note{max-width:560px;font-size:12.5px;line-height:1.6;color:var(--muted);text-align:center;text-wrap:balance;margin:0}
.note b{color:var(--ink);font-weight:500}
</style>
</head>
<body>

<div class="view" id="view">
  <canvas id="stage" aria-label="地形分析畫面"></canvas>
  <div class="msg" id="msg" hidden></div>
</div>

<div class="controls">
  <button id="btnCam" class="primary" aria-pressed="false">Live <span class="zh">開啟相機</span></button>
  <label class="btn" for="file">Upload <span class="zh">上傳影片</span><input id="file" type="file" accept="video/*,image/*"></label>
  <button id="btnDemo" aria-pressed="true">Demo <span class="zh">示範</span></button>
  <button id="btnDepth" aria-pressed="false">Depth <span class="zh">深度</span></button>
  <button id="btnView" aria-pressed="false">View <span class="zh" id="viewName">一般</span></button>
  <button id="btnPause" aria-pressed="false">Pause <span class="zh">暫停</span></button>
</div>
<p class="note">三道關卡依序進行：<b>① 角度</b>：陀螺儀確認鏡頭朝下看地面；<b>② 辨識</b>：AI 分出地面和障礙物（椅子、牆等），腳印只放在地面上；<b>③ 深度</b>：扣掉平地本來的遠近變化，只找凸起和凹陷。結果都是影像推估，<b>不是真實的抓地力或公尺數</b>，請勿用來決定實際落腳點。</p>

<script>
(() => {
const TF_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
const SEG_MODEL='Xenova/segformer-b0-finetuned-ade-512-512';
const DEPTH_MODEL='onnx-community/depth-anything-v2-small';

const stage=document.getElementById('stage'), ctx=stage.getContext('2d'), msgEl=document.getElementById('msg');
const small=document.createElement('canvas'), sctx=small.getContext('2d',{willReadFrequently:true});
const C={scan:'#4fc3f7',safe:'#4be38a',risk:'#ff4d5e',warn:'#ffb547',ink:'#dfe8ec',panel:'rgba(10,16,20,0.84)'};
const HUD='"Chakra Petch", ui-monospace, Menlo, monospace';
const ZH='"Noto Sans TC","PingFang TC",system-ui,sans-serif';

let CW=0,CH=0,DPR=1,AW=120,AH=213,CELL=8,cols=15,rows=26;
let prevGray=null,markers=[],nextSide='L',lastPick=0,paused=false,analysis=null,gate={ok:false,reason:'init'};
let source={kind:'demo'},demoT=0,lastTs=0,fps=60,shift={dx:0,dy:0},cumX=0,cumY=0,camStart=0;
const VIEWS=['normal','seg','depth','score'], VIEW_ZH={normal:'一般',seg:'辨識',depth:'深度',score:'評分'}; let view='normal';
const video=document.createElement('video'); video.muted=true; video.loop=true; video.playsInline=true; video.setAttribute('playsinline','');
let imageEl=null,camStream=null;

function showMsg(t,info){ msgEl.textContent=t||''; msgEl.hidden=!t; msgEl.classList.toggle('info',!!info); }

function resize(){
  const r=stage.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
  CW=Math.max(2,Math.round(r.width*DPR)); CH=Math.max(2,Math.round(r.height*DPR)); stage.width=CW; stage.height=CH;
  AW=120; AH=Math.round(AW*CH/CW); small.width=AW; small.height=AH; cols=Math.floor(AW/CELL); rows=Math.floor(AH/CELL);
  prevGray=null; markers=[]; segMap=null; depthMap=null;
}
new ResizeObserver(resize).observe(stage);

/* ================= ① TILT ================= */
const tilt={has:false,beta:0,gamma:0,asked:false};
function onOri(e){ if(e.beta==null) return; const k=tilt.has?0.25:1; tilt.beta+= (e.beta-tilt.beta)*k; tilt.gamma+=(e.gamma-tilt.gamma)*k; tilt.has=true; }
async function enableTilt(){
  if(tilt.asked) return; tilt.asked=true;
  window.addEventListener('deviceorientation',onOri);
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') showMsg('沒有取得陀螺儀權限，無法確認手機角度。可以重新整理頁面後再按「開啟相機」並允許「動作與方向」。',true); }
  }catch(e){}
}
function tiltDown(){ return 90-tilt.beta; } // degrees the rear camera points below the horizon (portrait)

/* ================= models ================= */
let tf=null; async function getTF(){ if(!tf){ tf=await import(TF_URL); } return tf; }
async function makePipe(task,model,gpuDtype){
  const t=await getTF(); const gpu=!!navigator.gpu;
  if(gpu){ try{ return await t.pipeline(task,model,{device:'webgpu',dtype:gpuDtype}); }catch(e){ console.warn('webgpu failed, using wasm',e); } }
  return await t.pipeline(task,model,{device:'wasm',dtype:'q8'});
}
const seg={state:'idle',pipe:null,busy:false,last:0,ms:0}; let segMap=null;
const dep={state:'idle',pipe:null,busy:false,last:0,ms:0,on:false}; let depthMap=null;
const capS=document.createElement('canvas'), capD=document.createElement('canvas');

const GROUND=new Set(['floor','road','grass','sidewalk','earth','field','rug','sand','path','stairs','stairway','runway','dirt track','land','step','mountain','rock','hill','carpet']);
const WATER=new Set(['water','sea','river','lake','swimming pool','waterfall','pool']);
const BACKDROP=new Set(['wall','sky','ceiling','building','windowpane','door','curtain','tree','skyscraper','house','fence','mirror','painting','blind']);
function kindOf(label){ const n=String(label).toLowerCase().split(/[;,]/)[0].trim();
  return GROUND.has(n)?1 : WATER.has(n)?3 : BACKDROP.has(n)?4 : 2; } // 1 ground, 2 obstacle, 3 water, 4 backdrop
function shortName(label){ return String(label).split(/[;,]/)[0].trim(); }

async function loadSeg(){
  if(seg.state==='loading'||seg.state==='ready') return; seg.state='loading';
  try{ seg.pipe=await makePipe('image-segmentation',SEG_MODEL,'fp32'); seg.state='ready'; }
  catch(e){ console.error(e); seg.state='error'; showMsg('地面辨識模型載入失敗（網路或瀏覽器不支援）。請確認網路後重新整理頁面。'); }
}
async function loadDepth(){
  if(dep.state==='loading'||dep.state==='ready') return; dep.state='loading';
  try{ dep.pipe=await makePipe('depth-estimation',DEPTH_MODEL,'fp16'); dep.state='ready'; }
  catch(e){ console.error(e); dep.state='error'; dep.on=false; btnDepth.setAttribute('aria-pressed','false'); showMsg('深度模型載入失敗。角度和地面辨識仍可正常使用。'); }
}

function grabFrame(cv,w){ const h=Math.round(w*CH/CW); if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;} cv.getContext('2d').drawImage(stage,0,0,w,h); return cv; }

async function runSeg(ts){
  seg.busy=true; seg.last=ts; const t0=performance.now(), ox=cumX, oy=cumY;
  try{
    const out=await seg.pipe((await getTF()).RawImage.fromCanvas(grabFrame(capS,320)));
    const lab=new Uint8Array(AW*AH), names=['?'], kinds=[0];
    for(const s of out){ const m=s.mask; if(!m) continue; const id=names.length; names.push(shortName(s.label)); kinds.push(kindOf(s.label));
      const mw=m.width, mh=m.height, ch=m.channels||1, d=m.data;
      for(let y=0;y<AH;y++){ const my=Math.min(mh-1,(y+0.5)*mh/AH|0)*mw; for(let x=0;x<AW;x++){ if(d[(my+Math.min(mw-1,(x+0.5)*mw/AW|0))*ch]>127) lab[y*AW+x]=id; } } }
    segMap={lab,names,kinds,offX:ox,offY:oy,img:null};
    seg.ms=seg.ms? seg.ms*0.8+(performance.now()-t0)*0.2 : performance.now()-t0;
  }catch(e){ console.error(e); }
  seg.busy=false;
}
async function runDepth(ts){
  dep.busy=true; dep.last=ts; const t0=performance.now(), ox=cumX, oy=cumY;
  try{
    const out=await dep.pipe((await getTF()).RawImage.fromCanvas(grabFrame(capD,256)));
    const d=out.depth; depthMap={data:d.data,w:d.width,h:d.height,ch:d.channels||1,offX:ox,offY:oy,img:null};
    dep.ms=dep.ms? dep.ms*0.8+(performance.now()-t0)*0.2 : performance.now()-t0;
  }catch(e){ console.error(e); }
  dep.busy=false;
}
// sample maps in current-frame small coords, compensating motion since capture
function segKind(x,y){ const m=segMap; if(!m) return 0; const mx=Math.round(x-(cumX-m.offX)), my=Math.round(y-(cumY-m.offY));
  if(mx<0||my<0||mx>=AW||my>=AH) return 0; return m.kinds[m.lab[my*AW+mx]]; }
function segId(x,y){ const m=segMap; const mx=Math.round(x-(cumX-m.offX)), my=Math.round(y-(cumY-m.offY));
  if(mx<0||my<0||mx>=AW||my>=AH) return 0; return m.lab[my*AW+mx]; }
function depthVal(x,y){ const m=depthMap; if(!m) return NaN; const mx=(x-(cumX-m.offX))/AW, my=(y-(cumY-m.offY))/AH;
  if(mx<0||my<0||mx>=1||my>=1) return NaN; return m.data[((my*m.h|0)*m.w+(mx*m.w|0))*m.ch]; }

/* ================= demo terrain ================= */
const TW=540,TH=1600, tex=document.createElement('canvas'); tex.width=TW; tex.height=TH;
(function buildTerrain(){
  const g=tex.getContext('2d'); let sd=7; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  g.fillStyle='#7d7873'; g.fillRect(0,0,TW,TH);
  for(let i=0;i<26000;i++){ const v=90+rnd()*120|0,x=rnd()*TW,y=rnd()*TH,r=0.8+rnd()*2.6; g.fillStyle=`rgb(${v},${v-3},${v-7})`; g.beginPath(); g.ellipse(x,y,r,r*(0.6+rnd()*0.6),rnd()*3,0,7); g.fill(); }
  for(let i=0;i<14;i++){ let x=rnd()*TW,y=rnd()*TH; const pts=[[x,y]]; for(let k=0;k<9;k++){x+=(rnd()-0.5)*90;y+=20+rnd()*45;pts.push([x,y]);} const w=4+rnd()*9;
    for(const off of [-TH,0,TH]){ g.strokeStyle='rgba(22,20,18,0.85)'; g.lineWidth=w; g.lineJoin='round'; g.beginPath(); pts.forEach(([px,py],k)=>k?g.lineTo(px,py+off):g.moveTo(px,py+off)); g.stroke(); } }
  for(let i=0;i<58;i++){ const cx=rnd()*TW,cy=rnd()*TH,R=34+rnd()*62,n=7+(rnd()*5|0),rot=rnd()*6.28,pts=[];
    for(let k=0;k<n;k++){ const a=rot+k/n*6.283,rr=R*(0.72+rnd()*0.42); pts.push([Math.cos(a)*rr,Math.sin(a)*rr*(0.7+rnd()*0.3)]); }
    const base=170+rnd()*45|0;
    for(const off of [-TH,0,TH]){ const y=cy+off; if(y<-R*2||y>TH+R*2) continue;
      const path=()=>{ g.beginPath(); pts.forEach(([px,py],k)=>k?g.lineTo(cx+px,y+py):g.moveTo(cx+px,y+py)); g.closePath(); };
      g.save(); g.translate(5,7); path(); g.fillStyle='rgba(28,26,24,0.65)'; g.fill(); g.restore();
      path(); const gr=g.createLinearGradient(cx-R,y-R,cx+R,y+R); gr.addColorStop(0,`rgb(${base+18},${base+16},${base+12})`); gr.addColorStop(1,`rgb(${base-22},${base-24},${base-28})`);
      g.fillStyle=gr; g.fill(); g.strokeStyle='rgba(40,36,33,0.9)'; g.lineWidth=1.6; g.stroke(); } }
})();
function drawBoot(g,x,y,w,h,ang){ g.save(); g.translate(x,y); g.rotate(ang); g.fillStyle='#3a2a1e'; g.beginPath(); g.ellipse(0,0,w/2,h/2,0,0,7); g.fill();
  g.fillStyle='#5a4330'; g.beginPath(); g.ellipse(0,-h*0.12,w*0.36,h*0.3,0,0,7); g.fill(); g.restore(); }
function drawDemo(dt){
  if(!paused) demoT+=dt; const scale=CW/TW*1.08, ox=-CW*0.04+Math.sin(demoT*1.1)*CW*0.025, s=((demoT*62)%TH)*scale, hh=TH*scale;
  ctx.drawImage(tex,ox,s,TW*scale,hh); ctx.drawImage(tex,ox,s-hh,TW*scale,hh);
  const ph=demoT*3.1,bw=CW*0.17,bh=CW*0.3;
  drawBoot(ctx,CW*0.36,CH-Math.max(0,Math.sin(ph))*CH*0.05,bw,bh,-0.12); drawBoot(ctx,CW*0.64,CH-Math.max(0,Math.sin(ph+Math.PI))*CH*0.05,bw,bh,0.12);
}
function drawCover(el,iw,ih){ if(!iw||!ih){ ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH); return false; }
  const s=Math.max(CW/iw,CH/ih),w=iw*s,h=ih*s; ctx.drawImage(el,(CW-w)/2,(CH-h)/2,w,h); return true; }

/* ================= texture + tracking ================= */
function toGray(){ sctx.drawImage(stage,0,0,AW,AH); const d=sctx.getImageData(0,0,AW,AH).data,g=new Float32Array(AW*AH);
  for(let i=0,j=0;i<g.length;i++,j+=4) g[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2]; return g; }
function track(prev,cur){
  const R=7,st=3,x0=R+2,x1=AW-R-2,y0=Math.max(R+2,AH*0.12|0),y1=Math.min(AH-R-2,AH*0.8|0),N=2*R+1,cost=new Float32Array(N*N); let best=Infinity,bi=0;
  for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){ let s=0; for(let y=y0;y<y1;y+=st){ const ro=y*AW,rp=(y-dy)*AW-dx; for(let x=x0;x<x1;x+=st) s+=Math.abs(cur[ro+x]-prev[rp+x]); }
    const k=(dy+R)*N+(dx+R); cost[k]=s; if(s<best){best=s;bi=k;} }
  const ix=bi%N,iy=bi/N|0, sub=(a,b,c)=>{const den=a-2*b+c; return den>0?0.5*(a-c)/den:0;}; let fx=0,fy=0;
  if(ix>0&&ix<N-1) fx=sub(cost[iy*N+ix-1],cost[bi],cost[iy*N+ix+1]); if(iy>0&&iy<N-1) fy=sub(cost[(iy-1)*N+ix],cost[bi],cost[(iy+1)*N+ix]);
  return {dx:ix-R+fx,dy:iy-R+fy};
}

/* ================= ③ depth: ground-plane residual ================= */
function planeRelief(isGround){
  if(!depthMap) return null;
  const zy0=AH*0.15|0, zy1=AH*0.8|0, xs=[],ys=[],ds=[];
  for(let y=zy0;y<zy1;y+=3) for(let x=1;x<AW-1;x+=3){ if(!isGround(x,y)) continue; const d=depthVal(x,y); if(!isNaN(d)){xs.push(x);ys.push(y);ds.push(d);} }
  if(ds.length<60) return null;
  let keep=ds.map(()=>true), P=null;
  for(let it=0;it<3;it++){
    let a=[0,0,0,0,0,0,0,0,0], b=[0,0,0];
    for(let i=0;i<ds.length;i++){ if(!keep[i]) continue; const v=[xs[i],ys[i],1]; for(let r=0;r<3;r++){ b[r]+=v[r]*ds[i]; for(let c=0;c<3;c++) a[r*3+c]+=v[r]*v[c]; } }
    P=solve3(a,b); if(!P) return null;
    const res=ds.map((d,i)=>Math.abs(d-(P[0]*xs[i]+P[1]*ys[i]+P[2]))); const kept=res.filter((r,i)=>keep[i]).sort((p,q)=>p-q);
    const mad=kept[kept.length>>1]||1; keep=res.map(r=>r<Math.max(3,3*mad));
  }
  let lo=Infinity,hi=-Infinity; for(let i=0;i<ds.length;i++){ const f=P[0]*xs[i]+P[1]*ys[i]+P[2]; lo=Math.min(lo,f); hi=Math.max(hi,f); }
  const span=hi-lo; if(span<8) return null;
  const rel=new Float32Array(cols*rows);
  for(let cy=0;cy<rows;cy++) for(let cx=0;cx<cols;cx++){ let s=0,n=0;
    for(let y=cy*CELL+1;y<cy*CELL+CELL;y+=2) for(let x=cx*CELL+1;x<cx*CELL+CELL;x+=2){ const d=depthVal(x,y); if(isNaN(d)) continue; s+=d-(P[0]*x+P[1]*y+P[2]); n++; }
    rel[cy*cols+cx]= n? (s/n)/span : 0; }
  return {rel,span};
}
function solve3(a,b){ const m=[[a[0],a[1],a[2],b[0]],[a[3],a[4],a[5],b[1]],[a[6],a[7],a[8],b[2]]];
  for(let i=0;i<3;i++){ let p=i; for(let r=i+1;r<3;r++) if(Math.abs(m[r][i])>Math.abs(m[p][i])) p=r; [m[i],m[p]]=[m[p],m[i]]; if(Math.abs(m[i][i])<1e-9) return null;
    for(let r=0;r<3;r++){ if(r===i) continue; const f=m[r][i]/m[i][i]; for(let c=i;c<4;c++) m[r][c]-=f*m[i][c]; } }
  return [m[0][3]/m[0][0],m[1][3]/m[1][1],m[2][3]/m[2][2]]; }

/* ================= ② + ③ cell analysis ================= */
function analyse(g){
  const useSeg= source.kind!=='demo' && !!segMap;
  const isGround=(x,y)=> useSeg? segKind(x,y)===1 : true;
  const n=cols*rows, gfr=new Float32Array(n), ofr=new Float32Array(n), wfr=new Float32Array(n), obsId=new Int16Array(n), edge=new Float32Array(n), dark=new Float32Array(n), stab=new Float32Array(n);
  // brightness stats over ground pixels only
  let sum=0,sq=0,cnt=0; const zy0=AH*0.15|0, zy1=AH*0.8|0;
  for(let y=zy0;y<zy1;y+=2) for(let x=0;x<AW;x+=2){ if(!isGround(x,y)) continue; const v=g[y*AW+x]; sum+=v; sq+=v*v; cnt++; }
  const mean=cnt?sum/cnt:128, sd=cnt?Math.sqrt(Math.max(1,sq/cnt-mean*mean)):40, darkT=mean-1.3*sd;
  let zoneG=0, zoneN=0; const seen={};
  for(let cy=0;cy<rows;cy++) for(let cx=0;cx<cols;cx++){
    let e=0,dk=0,c=0,gc=0,oc=0,wc=0,tot=0; const votes={};
    for(let y=cy*CELL;y<cy*CELL+CELL;y++){ if(y<1||y>=AH-1) continue;
      for(let x=cx*CELL;x<cx*CELL+CELL;x++){ if(x<1||x>=AW-1) continue; const i=y*AW+x; tot++;
        const k= useSeg? segKind(x,y) : 1;
        if(k===1) gc++; else if(k===2){ oc++; const id=segId(x,y); votes[id]=(votes[id]||0)+1; } else if(k===3) wc++;
        if(k!==1) continue;
        const gx=-g[i-AW-1]-2*g[i-1]-g[i+AW-1]+g[i-AW+1]+2*g[i+1]+g[i+AW+1], gy=-g[i-AW-1]-2*g[i-AW]-g[i-AW+1]+g[i+AW-1]+2*g[i+AW]+g[i+AW+1];
        e+=Math.sqrt(gx*gx+gy*gy); if(g[i]<darkT) dk++; c++; } }
    const k=cy*cols+cx; gfr[k]=tot?gc/tot:0; ofr[k]=tot?oc/tot:0; wfr[k]=tot?wc/tot:0; edge[k]=c?e/c:0; dark[k]=c?dk/c:0;
    let bid=0,bv=0; for(const id in votes) if(votes[id]>bv){bv=votes[id];bid=+id;} obsId[k]=bid;

/* ================= gate + loop ================= */
function computeGate(now){
  if(source.kind==='camera'){
    if(tilt.has){ const d=tiltDown(); if(d<20||d>100) return {ok:false,reason:'up'}; if(Math.abs(tilt.gamma)>30) return {ok:false,reason:'roll'}; }
  }

    if(seg.state==='error') return {ok:false,reason:'seg-error'};
    if(seg.state!=='ready') return {ok:false,reason:'seg-loading'};

}

  prevGray=g;

    if(gate.ok){ analysis=analyse(g); if(analysis.useSeg&&analysis.groundZone<0.15){ gate={ok:false,reason:'noground'}; markers.forEach(m=>m.dying=m.dying||ts); } else pick(analysis,ts); }
    else markers.forEach(m=>m.dying=m.dying||ts);

  markers=markers.filter(m=>!(m.y>CH*0.9||m.y<-m.h||m.x<-m.w||m.x>CW+m.w||(m.dying&&ts-m.dying>260)||(m.type==='step'&&ts-m.born>3200)));
  if(view==='seg') drawSegView(); else if(view==='depth') drawDepthView(); else if(view==='score') drawScoreView();
  const order={hazard:0,water:0,obstacle:1,cand:2,step:3};
  markers.sort((p,q)=>order[p.type]-order[q.type]).forEach(m=>{ let a=Math.min(1,(ts-m.born)/200); if(m.dying) a*=Math.max(0,1-(ts-m.dying)/260);
    if(m.type==='step'&&ts-m.born>1400) m.labelHidden=true; drawMarker(m,a); drawLabel(m,a); });
  drawHud(ts); if(!gate.ok) drawGatePanel(ts);
}

/* ================= controls ================= */
const btnDemo=document.getElementById('btnDemo'),btnCam=document.getElementById('btnCam'),btnDepth=document.getElementById('btnDepth'),btnView=document.getElementById('btnView'),btnPause=document.getElementById('btnPause'),file=document.getElementById('file'),viewName=document.getElementById('viewName');
function setSource(kind){
  source={kind}; prevGray=null; markers=[]; analysis=null; segMap=null; depthMap=null; showMsg('');
  btnDemo.setAttribute('aria-pressed',String(kind==='demo')); btnCam.setAttribute('aria-pressed',String(kind==='camera'));
  if(kind!=='camera'&&camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  if(kind!=='video'&&kind!=='camera'){ try{video.pause();}catch(e){} }
  if(kind!=='demo') loadSeg();
  setPaused(false);
}
function setPaused(p){ paused=p; btnPause.setAttribute('aria-pressed',String(p)); if(source.kind==='video'||source.kind==='camera'){ try{ p?video.pause():video.play().catch(()=>{}); }catch(e){} } }
btnDemo.onclick=()=>setSource('demo');
btnPause.onclick=()=>setPaused(!paused);
btnView.onclick=()=>{ view=VIEWS[(VIEWS.indexOf(view)+1)%VIEWS.length]; viewName.textContent=VIEW_ZH[view]; btnView.setAttribute('aria-pressed',String(view!=='normal')); };
btnDepth.onclick=()=>{ dep.on=!dep.on; btnDepth.setAttribute('aria-pressed',String(dep.on)); if(!dep.on){ depthMap=null; return; } loadDepth(); };
file.onchange=()=>{ const f=file.files&&file.files[0]; if(!f) return; const url=URL.createObjectURL(f);
  if(f.type.startsWith('image/')){ imageEl=new Image(); imageEl.onload=()=>setSource('image'); imageEl.src=url; }
  else { video.srcObject=null; video.src=url; setSource('video'); video.play().catch(()=>showMsg('影片無法自動播放，請按兩次「暫停」開始播放。')); }
  file.value=''; };
btnCam.onclick=async()=>{
  const tiltP=enableTilt(); // must start inside the tap (iOS)
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no');
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    video.src=''; video.srcObject=s; setSource('camera'); camStream=s; camStart=performance.now(); await video.play();
  }catch(e){
    showMsg(location.protocol!=='https:'&&location.hostname!=='localhost' ? '相機只能在 https 網址下開啟。請用 GitHub Pages 的網址打開。'
      : '無法開啟相機：請允許這個網站使用相機（iPhone：設定 › Safari › 相機），並用 Safari 或 Chrome 開啟，不要用 LINE / IG 內建瀏覽器。');
  }
  await tiltP;
};
if('wakeLock' in navigator){ document.addEventListener('click',()=>{ navigator.wakeLock.request('screen').catch(()=>{}); },{once:true}); }

(document.fonts? document.fonts.load(`700 20px "Chakra Petch"`).catch(()=>{}) : Promise.resolve()).finally(()=>{ resize(); requestAnimationFrame(frame); });
})();
</script>
